[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mi-home-cli"
version = "0.1.2"
description = "Command-line control for Xiaomi Home (MIoT) devices — 命令行控制米家设备"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "slightc" }]
keywords = [
    "xiaomi",
    "mihome",
    "mi-home",
    "miot",
    "smart-home",
    "home-automation",
    "cli",
    "iot",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Home Automation",
    "Topic :: Utilities",
]
dependencies = [
    "httpx>=0.27",
    "typer>=0.12",
    "rich>=13.0",
    "paho-mqtt>=2.1.0",
    "cryptography>=50.0.0",
    # 扫码登录（mi auth login --scan）在终端里画二维码。纯 Python、零依赖的小库，
    # 作为直接依赖，装好即用。
    "segno>=1.5",
]

[project.urls]
Homepage = "https://github.com/slightc/mi_home_cli"
Repository = "https://github.com/slightc/mi_home_cli"
Issues = "https://github.com/slightc/mi_home_cli/issues"

[project.optional-dependencies]
# 可选的运行时增强：登录时自动广播 mDNS，提高回调命中率。
mdns = ["zeroconf>=0.130"]

[dependency-groups]
dev = ["pytest>=8.0"]

[project.scripts]
mi = "mi_home_cli.cli.app:main"
mihome = "mi_home_cli.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/mi_home_cli"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
